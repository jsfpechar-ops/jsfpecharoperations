<!doctype html>
<html lang="{{ .Lang }}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>{{ ct $.Lang "shared_title" }} · UbyHost</title>
<link rel="stylesheet" href="/static/tokens.css?v=20261022-0284"><link rel="stylesheet" href="/static/app.css?v=20261104-0916"><link rel="stylesheet" href="/static/components.css?v=20261103-0930"><link rel="stylesheet" href="/static/cleaning.css?v=20261024-0291"></head>
<body class="cleaning-public"><main class="cleaning-page">

<header class="cleaning-page-heading"><div><span class="cleaning-wordmark">UbyHost</span><h1>{{ ct $.Lang "shared_title" }}</h1><p>{{ ct $.Lang "read_only" }}</p></div>
<nav class="cleaning-actions" aria-label="{{ ct $.Lang "language" }}"><a class="btn" href="?lang=en" lang="en">English</a><a class="btn" href="?lang=cs" lang="cs">Čeština</a><a class="btn" href="?lang={{ .Lang }}">{{ ct $.Lang "refresh" }}</a></nav></header>
{{ template "screen.html" . }}
</main></body></html>
