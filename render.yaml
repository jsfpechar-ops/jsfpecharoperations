# Render Blueprint — staging + optional Render production.
#
#   ubyhost-staging  → mock UbyPort (STAGING for this project — use this on Render)
#   ubyhost          → optional all-in-on-Render production (NOT used for ubyhost.com;
#                      live production is AWS Lightsail — see docs/DEPLOYMENT.md)
#
# Apply once in Render → New → Blueprint. See docs/DEPLOYMENT.md.
#
# Staging: free plan, ephemeral disk. ubyhost: Starter + disk if you keep it.

services:
  # ---------------------------------------------------------------------------
  # Staging / mock — nothing is sent to the police.
  # ---------------------------------------------------------------------------
  - type: web
    name: ubyhost-staging
    runtime: python
    region: frankfurt
    plan: free
    rootDir: App
    buildCommand: pip install -r requirements.txt
    startCommand: ./render_start.sh
    healthCheckPath: /healthz
    # Staging only. Production runs on AWS Lightsail (see docs/DEPLOYMENT.md).
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: UBYHOST_DEPLOYMENT
        value: staging
      - key: UBYHOST_UBYPORT_ENV
        value: mock
      - key: UBYHOST_ENABLE_SCHEDULER
        value: "1"
      - key: UBYHOST_GUEST_PIN
        value: "0"
      - key: UBYHOST_MOCK_URL
        value: http://127.0.0.1:8081/ws_uby/ws_uby.svc
      - key: UBYHOST_SECRET_KEY
        generateValue: true
      - key: UBYHOST_ADMIN_USERNAME
        value: admin
      # First administrator (e-mail link or staging password below).
      - key: UBYHOST_ADMIN_EMAIL
        value: josef@ubyhost.com
      # Staging username/password login (Render does not deliver mail). Copy from Environment after deploy.
      - key: UBYHOST_STAGING_LOGIN_PASSWORD
        generateValue: true
      # Staging test: no login, every visitor is the first administrator.
      - key: UBYHOST_STAGING_NO_LOGIN
        value: "1"
      - key: UBYHOST_MAIL_BACKEND
        value: console
      # Door codes (TTLock): set client id/secret in the Render dashboard
      # (Environment → sync off). Mock UbyPort stays on; manual stays only
      # until UBYHOST_DOOR_CODES_LIVE=1. See docs/DEPLOYMENT.md § Door codes.
      - key: UBYHOST_DOOR_CODES
        value: "1"
      - key: UBYHOST_TTLOCK_CLIENT_ID
        sync: false
      - key: UBYHOST_TTLOCK_CLIENT_SECRET
        sync: false
      - key: UBYHOST_PUBLIC_BASE_URL
        fromService:
          type: web
          name: ubyhost-staging
          envVarKey: RENDER_EXTERNAL_URL
