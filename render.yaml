# Render Blueprint — staging + optional Render production.
#
#   ubyhost-staging  → mock UbyPort (STAGING for this project — use this on Render)
#   ubyhost          → optional all-in-on-Render production (NOT used for ubyhost.com;
#                      live production is AWS Lightsail — see docs/DEPLOYMENT.md)
#
# Apply once in Render → New → Blueprint. See docs/DEPLOYMENT.md.
#
# Staging: free plan, ephemeral disk. ubyhost: Starter + disk if you keep it.

services:
  # ---------------------------------------------------------------------------
  # Staging / mock — nothing is sent to the police.
  # ---------------------------------------------------------------------------
  - type: web
    name: ubyhost-staging
    runtime: python
    region: frankfurt
    plan: free
    rootDir: App
    buildCommand: pip install -r requirements.txt
    startCommand: ./render_start.sh
    healthCheckPath: /healthz
    # Staging is manual/off by default — ship to production (ubyhost) from main.
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: UBYHOST_DEPLOYMENT
        value: staging
      - key: UBYHOST_UBYPORT_ENV
        value: mock
      - key: UBYHOST_ENABLE_SCHEDULER
        value: "1"
      - key: UBYHOST_GUEST_PIN
        value: "0"
      - key: UBYHOST_MOCK_URL
        value: http://127.0.0.1:8081/ws_uby/ws_uby.svc
      - key: UBYHOST_SECRET_KEY
        generateValue: true
      - key: UBYHOST_ADMIN_USERNAME
        value: admin
      - key: UBYHOST_ADMIN_PASSWORD
        generateValue: true
      - key: UBYHOST_PUBLIC_BASE_URL
        fromService:
          type: web
          name: ubyhost-staging
          envVarKey: RENDER_EXTERNAL_URL

  # ---------------------------------------------------------------------------
  # Production — real Foreign Police reporting.
  # Set UBYHOST_UBYPORT_ENV to "test" first, then "prod" after a clean run.
  # ---------------------------------------------------------------------------
  - type: web
    name: ubyhost
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: App
    buildCommand: pip install -r requirements.txt
    startCommand: ./render_start.sh
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: ubyhost-data
      mountPath: /opt/render/project/src/App/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: UBYHOST_DEPLOYMENT
        value: production
      - key: UBYHOST_UBYPORT_ENV
        value: test
      - key: UBYHOST_ENABLE_SCHEDULER
        value: "1"
      - key: UBYHOST_GUEST_PIN
        value: "1"
      - key: UBYHOST_SECRET_KEY
        generateValue: true
      - key: UBYHOST_ADMIN_USERNAME
        sync: false
      - key: UBYHOST_ADMIN_PASSWORD
        sync: false
      - key: UBYHOST_PUBLIC_BASE_URL
        fromService:
          type: web
          name: ubyhost
          envVarKey: RENDER_EXTERNAL_URL
