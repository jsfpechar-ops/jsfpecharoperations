name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            App/requirements.txt
            App/requirements.lock
            App/requirements-dev.txt

      - name: Install system tools used by tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age sqlite3

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock && pip install -r requirements-dev.txt

      - name: Dependency vulnerability audit
        run: pip install pip-audit==2.9.0 && pip-audit -r requirements.txt --strict

      - name: Lint for runtime errors
        run: ruff check app tests tools --select E9,F63,F7,F82,F401,F841

      - name: Type check (informational baseline)
        continue-on-error: true
        run: >-
          mypy app
          --ignore-missing-imports
          --follow-imports=skip
          --allow-untyped-defs
          --allow-untyped-calls
          --allow-incomplete-defs
          --disable-error-code=var-annotated

      - name: Run tests with coverage
        env:
          UBYHOST_UBYPORT_ENV: mock
          UBYHOST_DEPLOYMENT: staging
          UBYHOST_ENABLE_SCHEDULER: "0"
        run: >-
          python -m pytest tests -q
          --cov=app
          --cov-report=term-missing
          --cov-fail-under=86

  smoke:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: App

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            App/requirements.txt
            App/requirements.lock
            App/requirements-dev.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock && pip install -r requirements-dev.txt

      - name: Start app and run page smoke
        env:
          UBYHOST_UBYPORT_ENV: mock
          UBYHOST_DEPLOYMENT: staging
          UBYHOST_ENABLE_SCHEDULER: "0"
          # The smoke run drives the server as an anonymous staging host: no
          # administrator is created, so no page answers with a redirect to
          # /login. It also has to point the server at the same scratch data
          # directory the script seeds, or the pages render without fixtures.
          UBYHOST_BOOTSTRAP_ADMIN: "0"
          UBYHOST_GUEST_PIN: "0"
          UBYHOST_DATA_DIR: ${{ runner.temp }}/ubyhost-smoke
          PORT: "18080"
        run: |
          python -m mock_ubyport.server &
          sleep 2
          python -m uvicorn app.main:app --host 127.0.0.1 --port 18080 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/healthz >/dev/null && break
            sleep 1
          done
          python tools/smoke.py http://127.0.0.1:18080

  guest-browser:
    # The guest pages driven in real Chromium, the way a guest on a phone uses
    # them: group size, claim e-mail, one signed form per person, layout
    # measured on every screen. Markup tests alone let a blank group size, a
    # 0 x 0 signature pad and a misaligned date of birth reach guests.
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: App

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            App/requirements.txt
            App/requirements.lock
            App/requirements-dev.txt

      - name: Install dependencies and Chromium
        run: |
          pip install --require-hashes -r requirements.lock && pip install -r requirements-dev.txt
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Walk the guest flow in a browser
        env:
          UBYHOST_UBYPORT_ENV: mock
          UBYHOST_DEPLOYMENT: staging
          UBYHOST_ENABLE_SCHEDULER: "0"
          UBYHOST_REQUIRE_BROWSER: "1"
        # REQUIRE_BROWSER turns "Chromium is missing" from a skip into a failure.
        run: python -m pytest tests/test_guest_browser_e2e.py -q -rs

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck deploy and backup scripts (errors only)
        run: shellcheck -S error deploy/lightsail/scripts/*.sh App/scripts/*.sh docker-entrypoint.sh App/run.sh App/render_start.sh render_start.sh

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t ubyhost:ci .
      - name: Start container and wait for healthz
        run: |
          docker run -d --name ubyhost-ci -p 18081:8080 \
            -e UBYHOST_SECRET_KEY=ci-only-not-secret-ci-only-not-secret -e UBYHOST_ENABLE_SCHEDULER=0 \
            -e UBYHOST_BOOTSTRAP_ADMIN=0 ubyhost:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18081/healthz && exit 0
            sleep 2
          done
          docker logs ubyhost-ci
          exit 1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 50 }
      - name: gitleaks (last 50 commits)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2
          detect --source=/repo --redact --log-opts="-n 50"
