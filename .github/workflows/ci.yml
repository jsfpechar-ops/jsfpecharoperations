name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            App/requirements.txt
            App/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint for runtime errors
        run: ruff check app tests tools --select E9,F63,F7,F82,F401,F841

      - name: Type check (informational baseline)
        continue-on-error: true
        run: >-
          mypy app
          --ignore-missing-imports
          --follow-imports=skip
          --allow-untyped-defs
          --allow-untyped-calls
          --allow-incomplete-defs
          --disable-error-code=var-annotated

      - name: Run tests with coverage
        env:
          UBYHOST_UBYPORT_ENV: mock
          UBYHOST_DEPLOYMENT: staging
          UBYHOST_ENABLE_SCHEDULER: "0"
        run: >-
          python -m pytest tests -q
          --cov=app
          --cov-report=term-missing
          --cov-fail-under=87

  smoke:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: App

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            App/requirements.txt
            App/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Start app and run page smoke
        env:
          UBYHOST_UBYPORT_ENV: mock
          UBYHOST_DEPLOYMENT: staging
          UBYHOST_ENABLE_SCHEDULER: "0"
          UBYHOST_ADMIN_USERNAME: ci-admin
          UBYHOST_ADMIN_PASSWORD: Ci-Smoke-Password-2026!
          PORT: "18080"
        run: |
          python -m mock_ubyport.server &
          sleep 2
          python -m uvicorn app.main:app --host 127.0.0.1 --port 18080 &
          sleep 3
          python tools/smoke.py http://127.0.0.1:18080
