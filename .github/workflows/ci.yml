name: CI

on:
  push:
    branches: [main]
  pull_request:
  # When a merge to main does not queue CI (seen after #291), run this on main
  # so production deploy's require_green_ci gate can pass.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            App/requirements.txt
            App/requirements.lock
            App/requirements-dev.txt

      - name: Install system tools used by tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age sqlite3

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Passkey client logic (node)
        working-directory: ${{ github.workspace }}
        run: node --test App/tests/test_passkeys_client.cjs

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock && pip install -r requirements-dev.txt

      - name: Dependency vulnerability audit
        run: pip install pip-audit==2.9.0 && pip-audit -r requirements.txt --strict

      - name: Lint for runtime errors
        run: ruff check app tests tools --select E9,F63,F7,F82,F401,F841

      - name: Design lint (docs/design/MASTER.md 11.1)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/design_lint.py

      - name: Type check (informational baseline)
        continue-on-error: true
        run: >-
          mypy app
          --ignore-missing-imports
          --follow-imports=skip
          --allow-untyped-defs
          --allow-untyped-calls
          --allow-incomplete-defs
          --disable-error-code=var-annotated

      - name: Run tests with coverage
        env:
          UBYHOST_UBYPORT_ENV: mock
          UBYHOST_DEPLOYMENT: staging
          UBYHOST_ENABLE_SCHEDULER: "0"
        run: >-
          python -m pytest tests -q
          --cov=app
          --cov-report=term-missing
          --cov-fail-under=86
          --junitxml=/tmp/ubyhost-tests.xml

      - name: Annotate failed tests
        id: test_failures
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          failures = []
          report = Path("/tmp/ubyhost-tests.xml")
          if report.exists():
              for case in ET.parse(report).iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is not None:
                      title = (case.get("classname", "") + "." + case.get("name", ""))[:200]
                      detail = (failure.text or failure.get("message", ""))[-6000:]
                      detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title={title}::{detail}")
                      failures.append(title + ": " + " ".join((failure.text or failure.get("message", "")).split())[-3500:])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for index, detail in enumerate(failures[:8], 1):
                  output.write(f"failure_{index}={detail}\n")
          PY

      - name: ${{ steps.test_failures.outputs.failure_1 || 'Test failure detail 1' }}
        if: failure() && steps.test_failures.outputs.failure_1 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_2 || 'Test failure detail 2' }}
        if: failure() && steps.test_failures.outputs.failure_2 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_3 || 'Test failure detail 3' }}
        if: failure() && steps.test_failures.outputs.failure_3 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_4 || 'Test failure detail 4' }}
        if: failure() && steps.test_failures.outputs.failure_4 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_5 || 'Test failure detail 5' }}
        if: failure() && steps.test_failures.outputs.failure_5 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_6 || 'Test failure detail 6' }}
        if: failure() && steps.test_failures.outputs.failure_6 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_7 || 'Test failure detail 7' }}
        if: failure() && steps.test_failures.outputs.failure_7 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_8 || 'Test failure detail 8' }}
        if: failure() && steps.test_failures.outputs.failure_8 != ''
        run: 'true'

  smoke:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: App

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            App/requirements.txt
            App/requirements.lock
            App/requirements-dev.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock && pip install -r requirements-dev.txt

      - name: Start app and run page smoke
        env:
          UBYHOST_UBYPORT_ENV: mock
          UBYHOST_DEPLOYMENT: staging
          UBYHOST_ENABLE_SCHEDULER: "0"
          # The smoke run exercises actual host pages through staging's
          # synthetic no-login profile. Its fixtures belong to this scratch
          # database and are scoped to the bootstrapped synthetic admin.
          UBYHOST_STAGING_NO_LOGIN: "1"
          UBYHOST_BOOTSTRAP_ADMIN: "1"
          UBYHOST_ADMIN_EMAIL: smoke@example.invalid
          UBYHOST_ADMIN_USERNAME: smoke-admin
          UBYHOST_GUEST_PIN: "0"
          UBYHOST_MAIL_BACKEND: disabled
          UBYHOST_DATA_DIR: ${{ runner.temp }}/ubyhost-smoke
          PORT: "18080"
        run: |
          python -m mock_ubyport.server &
          sleep 2
          python -m uvicorn app.main:app --host 127.0.0.1 --port 18080 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/healthz >/dev/null && break
            sleep 1
          done
          python tools/smoke.py http://127.0.0.1:18080

  guest-browser:
    # The guest pages driven in real Chromium, the way a guest on a phone uses
    # them: group size, claim e-mail, one signed form per person, layout
    # measured on every screen. Markup tests alone let a blank group size, a
    # 0 x 0 signature pad and a misaligned date of birth reach guests.
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: App

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            App/requirements.txt
            App/requirements.lock
            App/requirements-dev.txt

      - name: Install dependencies and Chromium
        run: |
          pip install --require-hashes -r requirements.lock && pip install -r requirements-dev.txt
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium

      - name: Walk the guest flow in a browser
        env:
          UBYHOST_UBYPORT_ENV: mock
          UBYHOST_DEPLOYMENT: staging
          UBYHOST_ENABLE_SCHEDULER: "0"
          UBYHOST_REQUIRE_BROWSER: "1"
          UBYHOST_SHOTS_DIR: ${{ runner.temp }}/dashboard-calendar-shots
          UBYHOST_WIDE_GEOMETRY_DIR: ${{ runner.temp }}/dashboard-calendar-shots/wide
          UBYHOST_CAPTURE_FILTERS: "1"
        # REQUIRE_BROWSER turns "Chromium is missing" from a skip into a failure.
        run: >-
          python -m pytest tests/test_guest_browser_e2e.py tests/test_host_geometry.py
          tests/test_onboarding_wizard_browser.py tests/test_onboarding_wizard_survival.py
          tests/test_download_skeleton_browser.py tests/test_onboarding_followup_browser.py
          tests/test_host_stay_actions_browser.py tests/test_host_stay_detail_layout_browser.py
          tests/test_host_quiet_dashboard_browser.py tests/test_dashboard_calendar_browser.py tests/test_cleaning_browser.py tests/test_host_list_layouts_browser.py tests/test_host_filter_panels_browser.py tests/test_host_wide_geometry_browser.py tests/test_design_guardrails_browser.py tests/test_a11y_guard_browser.py tests/test_lock_navigation_browser.py tests/test_property_navigation_browser.py::test_shared_timing_pair_is_owned_by_properties -q -rs --junitxml=/tmp/ubyhost-tests.xml


      - name: Summarize required browser checks
        if: always()
        id: browser_summary
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          report = Path("/tmp/ubyhost-tests.xml")
          if not report.exists():
              raise SystemExit("Required browser report is missing")
          cases = list(ET.parse(report).iter("testcase"))
          failed = sum(case.find("failure") is not None or case.find("error") is not None for case in cases)
          skipped = sum(case.find("skipped") is not None for case in cases)
          summary = f"Browser checks: {len(cases) - failed - skipped} passed, {failed} failed, {skipped} skipped"
          print(summary)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("summary=" + summary + "\n")
          if skipped:
              raise SystemExit("Required browser checks must have zero skips")
          PY

      - name: ${{ steps.browser_summary.outputs.summary || 'Browser check summary' }}
        if: always()
        run: 'true'

      - name: Upload calendar and dashboard review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-calendar-review
          path: ${{ runner.temp }}/dashboard-calendar-shots
          if-no-files-found: warn

      - name: Annotate failed tests
        id: test_failures
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          failures = []
          report = Path("/tmp/ubyhost-tests.xml")
          if report.exists():
              for case in ET.parse(report).iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is not None:
                      title = (case.get("classname", "") + "." + case.get("name", ""))[:200]
                      detail = (failure.text or failure.get("message", ""))[-6000:]
                      detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title={title}::{detail}")
                      failures.append(title + ": " + " ".join((failure.text or failure.get("message", "")).split())[-3500:])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for index, detail in enumerate(failures[:8], 1):
                  output.write(f"failure_{index}={detail}\n")
          PY

      - name: ${{ steps.test_failures.outputs.failure_1 || 'Test failure detail 1' }}
        if: failure() && steps.test_failures.outputs.failure_1 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_2 || 'Test failure detail 2' }}
        if: failure() && steps.test_failures.outputs.failure_2 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_3 || 'Test failure detail 3' }}
        if: failure() && steps.test_failures.outputs.failure_3 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_4 || 'Test failure detail 4' }}
        if: failure() && steps.test_failures.outputs.failure_4 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_5 || 'Test failure detail 5' }}
        if: failure() && steps.test_failures.outputs.failure_5 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_6 || 'Test failure detail 6' }}
        if: failure() && steps.test_failures.outputs.failure_6 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_7 || 'Test failure detail 7' }}
        if: failure() && steps.test_failures.outputs.failure_7 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_8 || 'Test failure detail 8' }}
        if: failure() && steps.test_failures.outputs.failure_8 != ''
        run: 'true'

      - name: Upload onboarding screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-wizard-screenshots
          path: docs/tasks/0102-evidence/
          if-no-files-found: warn

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck deploy and backup scripts (errors only)
        run: shellcheck -S error deploy/lightsail/scripts/*.sh App/scripts/*.sh docker-entrypoint.sh App/run.sh App/render_start.sh render_start.sh

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t ubyhost:ci .
      - name: Start container and wait for healthz
        run: |
          docker run -d --name ubyhost-ci -p 18081:8080 \
            -e UBYHOST_SECRET_KEY=ci-only-not-secret-ci-only-not-secret -e UBYHOST_ENABLE_SCHEDULER=0 \
            -e UBYHOST_BOOTSTRAP_ADMIN=0 ubyhost:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18081/healthz && exit 0
            sleep 2
          done
          docker logs ubyhost-ci
          exit 1

  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 50 }
      - name: context lint (caps, links, briefs)
        run: python3 scripts/context_lint.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 50 }
      - name: gitleaks (last 50 commits)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2
          detect --source=/repo --redact --log-opts="-n 50"

  calendar-review:
    # Fast feature feedback runs alongside the full required regression suite.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            App/requirements.lock
            App/requirements-dev.txt
      - name: Install dependencies and Chromium
        run: |
          pip install --require-hashes -r requirements.lock && pip install -r requirements-dev.txt
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Exercise calendar booking interactions and geometry
        env:
          UBYHOST_UBYPORT_ENV: mock
          UBYHOST_DEPLOYMENT: staging
          UBYHOST_ENABLE_SCHEDULER: "0"
          UBYHOST_REQUIRE_BROWSER: "1"
          UBYHOST_SHOTS_DIR: ${{ runner.temp }}/calendar-feature-shots
        run: >-
          python -m pytest tests/test_cleaning.py tests/test_cleaning_browser.py
          tests/test_dashboard_calendar.py tests/test_dashboard_calendar_browser.py
          -q -rs --junitxml=/tmp/calendar-review.xml
      - name: Summarize calendar checks
        if: always()
        id: calendar_summary
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          report = Path("/tmp/calendar-review.xml")
          if not report.exists():
              raise SystemExit("Calendar test report is missing")
          cases = list(ET.parse(report).iter("testcase"))
          failed = sum(case.find("failure") is not None or case.find("error") is not None for case in cases)
          skipped = sum(case.find("skipped") is not None for case in cases)
          summary = f"Calendar checks: {len(cases) - failed - skipped} passed, {failed} failed, {skipped} skipped"
          print(summary)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("summary=" + summary + "\n")
          if skipped:
              raise SystemExit("Calendar checks must have zero skips")
          PY
      - name: ${{ steps.calendar_summary.outputs.summary || 'Calendar check summary' }}
        if: always()
        run: 'true'
      - name: Annotate calendar failures
        if: failure()
        id: calendar_failures
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          failures = []
          path = Path("/tmp/calendar-review.xml")
          if path.exists():
              for case in ET.parse(path).iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is not None:
                      title = (case.get("classname", "") + "." + case.get("name", ""))[:200]
                      detail = (failure.text or failure.get("message", ""))[-6000:]
                      detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title={title}::{detail}")
                      failures.append(title + ": " + " ".join((failure.text or failure.get("message", "")).split())[-3500:])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for index, detail in enumerate(failures[:4], 1):
                  output.write(f"failure_{index}={detail}\n")
          PY
      - name: ${{ steps.calendar_failures.outputs.failure_1 || 'Calendar failure detail 1' }}
        if: failure() && steps.calendar_failures.outputs.failure_1 != ''
        run: 'true'
      - name: ${{ steps.calendar_failures.outputs.failure_2 || 'Calendar failure detail 2' }}
        if: failure() && steps.calendar_failures.outputs.failure_2 != ''
        run: 'true'
      - name: ${{ steps.calendar_failures.outputs.failure_3 || 'Calendar failure detail 3' }}
        if: failure() && steps.calendar_failures.outputs.failure_3 != ''
        run: 'true'
      - name: ${{ steps.calendar_failures.outputs.failure_4 || 'Calendar failure detail 4' }}
        if: failure() && steps.calendar_failures.outputs.failure_4 != ''
        run: 'true'
      - name: Upload calendar feature screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-feature-review
          path: ${{ runner.temp }}/calendar-feature-shots
          if-no-files-found: warn

  door-code-access-review:
    # Focused geometry and timing checks run without waiting for the full suite.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            App/requirements.lock
            App/requirements-dev.txt
      - name: Install dependencies and both browser engines
        run: |
          pip install --require-hashes -r requirements.lock && pip install -r requirements-dev.txt
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify actual code hours and disclosure geometry
        env:
          UBYHOST_UBYPORT_ENV: mock
          UBYHOST_DEPLOYMENT: staging
          UBYHOST_ENABLE_SCHEDULER: "0"
          UBYHOST_REQUIRE_BROWSER: "1"
          UBYHOST_SHOTS_DIR: ${{ runner.temp }}/door-code-shots
        run: >-
          python -m pytest tests/test_door_code_window.py tests/test_door_code_window_browser.py
          tests/test_onboarding_wizard_survival.py tests/test_times_required_0210.py
          tests/test_static_versions.py -q -rs --junitxml=/tmp/door-code-review.xml
      - name: Require zero skipped disclosure checks
        id: disclosure_summary
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          path = Path("/tmp/door-code-review.xml")
          if not path.exists():
              raise SystemExit("Disclosure test report is missing")
          cases = list(ET.parse(path).iter("testcase"))
          skipped = sum(case.find("skipped") is not None for case in cases)
          failed = sum(case.find("failure") is not None or case.find("error") is not None for case in cases)
          print(f"Disclosure checks: {len(cases) - failed - skipped} passed, {failed} failed, {skipped} skipped")
          details = []
          for case in cases:
              failure = case.find("failure")
              if failure is None:
                  failure = case.find("error")
              if failure is not None:
                  details.append(case.get("name", "") + ": " + " ".join((failure.text or failure.get("message", "")).split())[-7000:])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"summary={len(cases) - failed - skipped} passed, {failed} failed, {skipped} skipped\n")
              for index, detail in enumerate(details[:3], 1):
                  output.write(f"failure_{index}={detail}\n")
          if not cases or skipped or failed:
              raise SystemExit("All disclosure checks must pass with zero skips")
          PY
      - name: ${{ steps.disclosure_summary.outputs.summary || 'Disclosure check summary' }}
        if: always()
        run: 'true'
      - name: ${{ steps.disclosure_summary.outputs.failure_1 || 'Disclosure failure detail 1' }}
        if: failure() && steps.disclosure_summary.outputs.failure_1 != ''
        run: 'true'
      - name: ${{ steps.disclosure_summary.outputs.failure_2 || 'Disclosure failure detail 2' }}
        if: failure() && steps.disclosure_summary.outputs.failure_2 != ''
        run: 'true'
      - name: ${{ steps.disclosure_summary.outputs.failure_3 || 'Disclosure failure detail 3' }}
        if: failure() && steps.disclosure_summary.outputs.failure_3 != ''
        run: 'true'
      - name: Upload disclosure screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: door-code-access-review
          path: |
            ${{ runner.temp }}/door-code-shots
            /tmp/door-code-review.xml
          if-no-files-found: error
