name: CI

on:
  push:
    branches: [main]
  pull_request:
  # When a merge to main does not queue CI (seen after #291), run this on main
  # so production deploy's require_green_ci gate can pass.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            App/requirements.txt
            App/requirements.lock
            App/requirements-dev.txt

      - name: Install system tools used by tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age sqlite3

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Passkey client logic (node)
        working-directory: ${{ github.workspace }}
        run: node --test App/tests/test_passkeys_client.cjs

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock && pip install -r requirements-dev.txt

      - name: Dependency vulnerability audit
        run: pip install pip-audit==2.9.0 && pip-audit -r requirements.txt --strict

      - name: Lint for runtime errors
        run: ruff check app tests tools --select E9,F63,F7,F82,F401,F841

      - name: Design lint (docs/design/MASTER.md 11.1)
        working-directory: ${{ github.workspace }}
        run: python3 scripts/design_lint.py

      - name: Type check (informational baseline)
        continue-on-error: true
        run: >-
          mypy app
          --ignore-missing-imports
          --follow-imports=skip
          --allow-untyped-defs
          --allow-untyped-calls
          --allow-incomplete-defs
          --disable-error-code=var-annotated

      - name: Run tests with coverage
        env:
          UBYHOST_UBYPORT_ENV: mock
          UBYHOST_DEPLOYMENT: staging
          UBYHOST_ENABLE_SCHEDULER: "0"
        run: >-
          python -m pytest tests -q
          --cov=app
          --cov-report=term-missing
          --cov-fail-under=86
          --junitxml=/tmp/ubyhost-tests.xml

      - name: Annotate failed tests
        id: test_failures
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          failures = []
          report = Path("/tmp/ubyhost-tests.xml")
          if report.exists():
              for case in ET.parse(report).iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is not None:
                      title = (case.get("classname", "") + "." + case.get("name", ""))[:200]
                      detail = (failure.text or failure.get("message", ""))[-6000:]
                      detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title={title}::{detail}")
                      failures.append(title + ": " + " ".join((failure.text or failure.get("message", "")).split())[-3500:])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for index, detail in enumerate(failures[:8], 1):
                  output.write(f"failure_{index}={detail}\n")
          PY

      - name: ${{ steps.test_failures.outputs.failure_1 || 'Test failure detail 1' }}
        if: failure() && steps.test_failures.outputs.failure_1 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_2 || 'Test failure detail 2' }}
        if: failure() && steps.test_failures.outputs.failure_2 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_3 || 'Test failure detail 3' }}
        if: failure() && steps.test_failures.outputs.failure_3 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_4 || 'Test failure detail 4' }}
        if: failure() && steps.test_failures.outputs.failure_4 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_5 || 'Test failure detail 5' }}
        if: failure() && steps.test_failures.outputs.failure_5 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_6 || 'Test failure detail 6' }}
        if: failure() && steps.test_failures.outputs.failure_6 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_7 || 'Test failure detail 7' }}
        if: failure() && steps.test_failures.outputs.failure_7 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_8 || 'Test failure detail 8' }}
        if: failure() && steps.test_failures.outputs.failure_8 != ''
        run: 'true'

  smoke:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: App

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            App/requirements.txt
            App/requirements.lock
            App/requirements-dev.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.lock && pip install -r requirements-dev.txt

      - name: Start app and run page smoke
        env:
          UBYHOST_UBYPORT_ENV: mock
          UBYHOST_DEPLOYMENT: staging
          UBYHOST_ENABLE_SCHEDULER: "0"
          # The smoke run exercises actual host pages through staging's
          # synthetic no-login profile. Its fixtures belong to this scratch
          # database and are scoped to the bootstrapped synthetic admin.
          UBYHOST_STAGING_NO_LOGIN: "1"
          UBYHOST_BOOTSTRAP_ADMIN: "1"
          UBYHOST_ADMIN_EMAIL: smoke@example.invalid
          UBYHOST_ADMIN_USERNAME: smoke-admin
          UBYHOST_GUEST_PIN: "0"
          UBYHOST_MAIL_BACKEND: disabled
          UBYHOST_DATA_DIR: ${{ runner.temp }}/ubyhost-smoke
          PORT: "18080"
        run: |
          python -m mock_ubyport.server &
          sleep 2
          python -m uvicorn app.main:app --host 127.0.0.1 --port 18080 &
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/healthz >/dev/null && break
            sleep 1
          done
          python tools/smoke.py http://127.0.0.1:18080

  browser-shard:
    # Every browser test, collected by pattern so none can be forgotten.
    # Four shards run in parallel; each needs Chromium, some need WebKit.
    name: browser shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: App

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            App/requirements.txt
            App/requirements.lock
            App/requirements-dev.txt

      - name: Install dependencies, Chromium and WebKit
        run: |
          pip install --require-hashes -r requirements.lock && pip install -r requirements-dev.txt
          pip install playwright==1.63.0
          python -m playwright install --with-deps chromium webkit

      - name: Pick this shard's files
        id: files
        run: |
          files="$(ls tests/*_browser.py tests/test_guest_browser_e2e.py tests/test_host_geometry.py \
            tests/test_wp28_geometry.py tests/test_onboarding_wizard_survival.py | sort -u \
            | awk -v n=4 -v s=${{ matrix.shard }} '(NR - 1) % n == s - 1' | tr '\n' ' ')"
          echo "files=${files}" >> "$GITHUB_OUTPUT"
          echo "Shard ${{ matrix.shard }}: ${files}"

      - name: Run browser tests
        env:
          UBYHOST_UBYPORT_ENV: mock
          UBYHOST_DEPLOYMENT: staging
          UBYHOST_ENABLE_SCHEDULER: "0"
          UBYHOST_REQUIRE_BROWSER: "1"
          UBYHOST_SHELL_BROWSERS: chromium,webkit
          UBYHOST_SHOTS_DIR: ${{ runner.temp }}/browser-shots
          UBYHOST_WIDE_GEOMETRY_DIR: ${{ runner.temp }}/browser-shots/wide
          UBYHOST_CAPTURE_FILTERS: "1"
          UBYHOST_PASSKEY_SHOTS: ${{ runner.temp }}/browser-shots/passkey
        # REQUIRE_BROWSER turns "Chromium is missing" from a skip into a failure.
        run: python -m pytest ${{ steps.files.outputs.files }} -q -rs --junitxml=/tmp/ubyhost-tests.xml

      - name: Passkey login on WebKit
        if: matrix.shard == 1
        env:
          PASSKEY_BROWSER: webkit
          UBYHOST_REQUIRE_BROWSER: "1"
          UBYHOST_UBYPORT_ENV: mock
          UBYHOST_DEPLOYMENT: staging
          UBYHOST_ENABLE_SCHEDULER: "0"
          UBYHOST_PASSKEY_SHOTS: ${{ runner.temp }}/browser-shots/passkey-webkit
        run: python -m pytest tests/test_passkeys_client_browser.py -q -rs --junitxml=/tmp/passkey-webkit.xml


      - name: Summarize required browser checks
        if: always()
        id: browser_summary
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          report = Path("/tmp/ubyhost-tests.xml")
          if not report.exists():
              raise SystemExit("Required browser report is missing")
          cases = list(ET.parse(report).iter("testcase"))
          failed = sum(case.find("failure") is not None or case.find("error") is not None for case in cases)
          skipped = sum(case.find("skipped") is not None for case in cases)
          summary = f"Browser checks: {len(cases) - failed - skipped} passed, {failed} failed, {skipped} skipped"
          print(summary)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("summary=" + summary + "\n")
          if skipped:
              raise SystemExit("Required browser checks must have zero skips")
          PY

      - name: ${{ steps.browser_summary.outputs.summary || 'Browser check summary' }}
        if: always()
        run: 'true'

      - name: Annotate failed tests
        id: test_failures
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          failures = []
          report = Path("/tmp/ubyhost-tests.xml")
          if report.exists():
              for case in ET.parse(report).iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is not None:
                      title = (case.get("classname", "") + "." + case.get("name", ""))[:200]
                      detail = (failure.text or failure.get("message", ""))[-6000:]
                      detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title={title}::{detail}")
                      failures.append(title + ": " + " ".join((failure.text or failure.get("message", "")).split())[-3500:])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for index, detail in enumerate(failures[:8], 1):
                  output.write(f"failure_{index}={detail}\n")
          PY

      - name: ${{ steps.test_failures.outputs.failure_1 || 'Test failure detail 1' }}
        if: failure() && steps.test_failures.outputs.failure_1 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_2 || 'Test failure detail 2' }}
        if: failure() && steps.test_failures.outputs.failure_2 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_3 || 'Test failure detail 3' }}
        if: failure() && steps.test_failures.outputs.failure_3 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_4 || 'Test failure detail 4' }}
        if: failure() && steps.test_failures.outputs.failure_4 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_5 || 'Test failure detail 5' }}
        if: failure() && steps.test_failures.outputs.failure_5 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_6 || 'Test failure detail 6' }}
        if: failure() && steps.test_failures.outputs.failure_6 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_7 || 'Test failure detail 7' }}
        if: failure() && steps.test_failures.outputs.failure_7 != ''
        run: 'true'

      - name: ${{ steps.test_failures.outputs.failure_8 || 'Test failure detail 8' }}
        if: failure() && steps.test_failures.outputs.failure_8 != ''
        run: 'true'

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-shots-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/browser-shots
            docs/tasks/0102-evidence/
          if-no-files-found: warn

  browser:
    # The one name the deploy gate and the main ruleset require.
    if: always()
    needs: browser-shard
    runs-on: ubuntu-latest
    steps:
      - name: All browser shards passed
        run: test "${{ needs.browser-shard.result }}" = "success"


  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck deploy and backup scripts (errors only)
        run: shellcheck -S error deploy/lightsail/scripts/*.sh App/scripts/*.sh docker-entrypoint.sh App/run.sh App/render_start.sh render_start.sh

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t ubyhost:ci .
      - name: Start container and wait for healthz
        run: |
          docker run -d --name ubyhost-ci -p 18081:8080 \
            -e UBYHOST_SECRET_KEY=ci-only-not-secret-ci-only-not-secret -e UBYHOST_ENABLE_SCHEDULER=0 \
            -e UBYHOST_BOOTSTRAP_ADMIN=0 ubyhost:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18081/healthz && exit 0
            sleep 2
          done
          docker logs ubyhost-ci
          exit 1

  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 50 }
      - name: context lint (caps, links, briefs)
        run: python3 scripts/context_lint.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 50 }
      - name: gitleaks (last 50 commits)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2
          detect --source=/repo --redact --log-opts="-n 50"
