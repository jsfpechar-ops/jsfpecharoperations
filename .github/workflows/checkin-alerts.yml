name: Check-in alert regression

on:
  pull_request:
    paths:
      - 'App/app/alerts.py'
      - 'App/app/claim.py'
      - 'App/tests/test_claim_checkin_alerts.py'
      - '.github/workflows/checkin-alerts.yml'

permissions:
  contents: read

jobs:
  checkin-alerts:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: App
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            App/requirements.lock
            App/requirements-dev.txt
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends age sqlite3 2>&1 | tail -30
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.lock 2>&1 | tail -30
          pip install -r requirements-dev.txt 2>&1 | tail -30
      - name: Check changed Python files
        run: ruff check app/alerts.py app/claim.py tests/test_claim_checkin_alerts.py --select E9,F63,F7,F82,F401,F841 2>&1 | tail -30
      - name: Verify warning lifecycle and existing claim and alert behavior
        env:
          UBYHOST_UBYPORT_ENV: mock
          UBYHOST_DEPLOYMENT: staging
          UBYHOST_ENABLE_SCHEDULER: '0'
        run: >-
          python -m pytest tests/test_claim_*.py tests/test_alert*.py
          tests/test_notification_copy.py tests/test_arrival_nudge_0245.py
          -q --tb=short --junitxml=/tmp/checkin-alerts.xml 2>&1 | tail -30
      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkin-alert-regression
          path: /tmp/checkin-alerts.xml
          if-no-files-found: warn
