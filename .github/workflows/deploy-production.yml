name: Deploy production

# Production = AWS Lightsail (ubyhost.com). It is deployed ONLY by hand:
# Actions → Deploy production → force_confirm=DEPLOY, and only after the change
# has been clicked through on staging (1865). Nothing reaches production just
# because CI went green.
#
# Staging is the automatic step: a green CI run on main deploys that commit to
# the staging Lightsail server (deploy-staging.yml, staging.ubyhost.com, mock
# UbyPort), and any branch can be deployed there by hand.
# See docs/DEPLOYMENT.md

on:
  workflow_dispatch:
    inputs:
      force_confirm:
        description: "Type DEPLOY to deploy the current main revision to production"
        required: true
        type: string

permissions:
  contents: read
  checks: read

# One production deploy at a time: two overlapping runs would race the same
# checkout on the server. The running one is never cancelled — a half-applied
# deploy is worse than a late one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # The steps live in deploy-lightsail.yml, shared with deploy-staging.yml.
  # It pins the run to the current head of main, refuses unless CI is green
  # for that commit, and checks that the server's .env says production before
  # anything on it changes.
  lightsail:
    # 0422: deploy-lightsail.yml pushes the image to GHCR. Granted here, not
    # at workflow level, so the other job keeps read-only permissions.
    permissions:
      contents: read
      checks: read
      packages: write
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.force_confirm == 'DEPLOY'
    uses: ./.github/workflows/deploy-lightsail.yml
    with:
      environment: production
      ref: main
      require_green_ci: true
      health_url: https://ubyhost.com/healthz
    secrets: inherit
