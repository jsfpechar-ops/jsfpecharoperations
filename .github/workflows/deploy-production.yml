name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render production deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK is not set."
            echo "Production will not deploy from CI until you add the deploy hook URL from"
            echo "Render → ubyhost → Settings → Deploy Hook as a GitHub Actions secret."
            echo "You can also enable autoDeploy on the ubyhost service (branch: main)."
            exit 0
          fi
          echo "Deploying ubyhost (production) from main…"
          curl -fsSL -X POST "${RENDER_DEPLOY_HOOK}"
          echo "Production deploy hook triggered."
