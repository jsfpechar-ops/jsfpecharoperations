name: Deploy production

# Production = AWS Lightsail (ubyhost.com). Staging = Render ubyhost-staging (mock).
# See docs/DEPLOYMENT.md

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_confirm:
        description: "Type DEPLOY to deploy the current main revision without a workflow_run CI gate"
        required: true
        type: string

permissions:
  contents: read

jobs:
  lightsail:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.force_confirm == 'DEPLOY') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Lightsail (production)
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_PRIVATE_KEY: ${{ secrets.LIGHTSAIL_SSH_PRIVATE_KEY }}
          LIGHTSAIL_AUTO_DEPLOY: ${{ secrets.LIGHTSAIL_AUTO_DEPLOY }}
          GH_DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force_confirm }}" != "DEPLOY" ]; then
            echo "Manual deploy requires force_confirm=DEPLOY."
            exit 1
          fi
          if [ -z "${LIGHTSAIL_SSH_PRIVATE_KEY}" ] || [ -z "${LIGHTSAIL_HOST}" ]; then
            echo "LIGHTSAIL_HOST / LIGHTSAIL_SSH_PRIVATE_KEY not set — skipping automated deploy."
            echo "Manual: ssh -i YOUR.pem ubuntu@HOST 'cd /opt/ubyhost && git pull origin main && cd deploy/lightsail && ./scripts/deploy.sh'"
            exit 0
          fi
          # Optional brake: set LIGHTSAIL_AUTO_DEPLOY=0 to skip CI-triggered deploys only.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            case "${LIGHTSAIL_AUTO_DEPLOY:-1}" in
              0|false|no) ;;
              *)
                echo "CI auto-deploy enabled (set LIGHTSAIL_AUTO_DEPLOY=0 to pause)."
                ;;
            esac
            case "${LIGHTSAIL_AUTO_DEPLOY:-1}" in
              0|false|no)
                echo "Skipping Lightsail deploy for this CI run (LIGHTSAIL_AUTO_DEPLOY=0)."
                exit 0
                ;;
            esac
          fi
          # Validate the SHA before it is interpolated into the remote shell.
          if ! printf '%s' "${DEPLOY_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "DEPLOY_SHA is not a 40-character lowercase hex SHA: '${DEPLOY_SHA}'" >&2
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "${LIGHTSAIL_SSH_PRIVATE_KEY}" > ~/.ssh/lightsail_deploy.pem
          chmod 600 ~/.ssh/lightsail_deploy.pem
          LIGHTSAIL_HOST="$(printf '%s' "${LIGHTSAIL_HOST}" | tr -d '[:space:]')"
          LIGHTSAIL_HOST="${LIGHTSAIL_HOST#ubuntu@}"
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/lightsail_deploy.pem "ubuntu@${LIGHTSAIL_HOST}" bash -s <<REMOTE
          DEPLOY_SHA="${DEPLOY_SHA}"
          set -euo pipefail
          INSTALL=/opt/ubyhost
          REPO="https://x-access-token:${GH_DEPLOY_TOKEN}@github.com/jsfpechar-ops/jsfpecharoperations.git"
          if [ ! -d "\${INSTALL}/.git" ]; then
            echo "==> No git repo at \${INSTALL}; bootstrapping for CI deploy"
            if [ -d "\${INSTALL}/deploy/lightsail" ]; then
              cd "\${INSTALL}"
              git init
              git remote add origin "\${REPO}" 2>/dev/null || git remote set-url origin "\${REPO}"
              git fetch --depth 1 origin "\${DEPLOY_SHA}"
              git reset --hard "\${DEPLOY_SHA}"
            elif [ ! -e "\${INSTALL}" ] || [ -z "\$(ls -A "\${INSTALL}" 2>/dev/null)" ]; then
              git clone --depth 1 "\${REPO}" "\${INSTALL}"
              cd "\${INSTALL}"
              git fetch --depth 1 origin "\${DEPLOY_SHA}"
              git reset --hard "\${DEPLOY_SHA}"
            else
              echo "ERROR: \${INSTALL} is not a git repo and layout is unexpected" >&2
              exit 1
            fi
          fi
          cd "\${INSTALL}"
          git remote set-url origin "\${REPO}"
          git fetch origin "\${DEPLOY_SHA}"
          git reset --hard "\${DEPLOY_SHA}"
          cd deploy/lightsail
          chmod +x scripts/*.sh
          ./scripts/deploy.sh
          REMOTE
          rm -f ~/.ssh/lightsail_deploy.pem
          curl --fail --show-error --silent --retry 5 --retry-delay 5 https://ubyhost.com/healthz

  render-staging:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.force_confirm == 'DEPLOY') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Optional Render staging deploy hook
        env:
          RENDER_STAGING_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          HOOK="${RENDER_STAGING_DEPLOY_HOOK:-${RENDER_DEPLOY_HOOK:-}}"
          if [ -z "${HOOK}" ]; then
            echo "No Render deploy hook secret — skip (staging deploy manually in Render if needed)."
            exit 0
          fi
          echo "Triggering Render deploy hook (staging / legacy)…"
          curl -fsSL -X POST "${HOOK}"
