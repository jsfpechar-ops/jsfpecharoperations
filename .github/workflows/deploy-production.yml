name: Deploy production

# Production = AWS Lightsail (ubyhost.com). Staging = the staging Lightsail
# server (deploy-staging.yml, mock UbyPort) and Render ubyhost-staging (mock).
# See docs/DEPLOYMENT.md
#
# MANUAL ONLY. This deploy no longer runs automatically on a push to main. Every
# change reaches main through a reviewed pull request, and production is promoted
# by a person running this workflow (Actions → Deploy production → Run workflow)
# with force_confirm=DEPLOY. Staging is deployed separately: Actions → Deploy
# staging (any branch), or manually in Render.

on:
  workflow_dispatch:
    inputs:
      force_confirm:
        description: "Type DEPLOY to deploy the current main revision to production"
        required: true
        type: string

permissions:
  contents: read
  checks: read

# One production deploy at a time: two overlapping runs would race the same
# checkout on the server. The running one is never cancelled — a half-applied
# deploy is worse than a late one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # The steps live in deploy-lightsail.yml, shared with deploy-staging.yml.
  # It pins the run to the current head of main, refuses unless CI is green
  # for that commit, and checks that the server's .env says production before
  # anything on it changes.
  lightsail:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.force_confirm == 'DEPLOY'
    uses: ./.github/workflows/deploy-lightsail.yml
    with:
      environment: production
      ref: main
      require_green_ci: true
      health_url: https://ubyhost.com/healthz
    secrets: inherit

  render-staging:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.force_confirm == 'DEPLOY'
    runs-on: ubuntu-latest
    steps:
      - name: Optional Render staging deploy hook
        env:
          RENDER_STAGING_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          HOOK="${RENDER_STAGING_DEPLOY_HOOK:-${RENDER_DEPLOY_HOOK:-}}"
          if [ -z "${HOOK}" ]; then
            echo "No Render deploy hook secret — skip (staging deploy manually in Render if needed)."
            exit 0
          fi
          echo "Triggering Render deploy hook (staging / legacy)…"
          curl -fsSL -X POST "${HOOK}"
