name: Mobile More regression

on:
  pull_request:
    paths:
      - 'App/app/static/shell.js'
      - 'App/app/static/skeleton.js'
      - 'App/app/templates/base.html'
      - 'App/app/templates/_shell_tabbar.html'
      - 'App/app/templates/dashboard.html'
      - 'App/tests/test_design_shell_browser.py'
      - '.github/workflows/mobile-more.yml'

permissions:
  contents: read

jobs:
  mobile-more:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: App
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            App/requirements.lock
            App/requirements-dev.txt
      - name: Install tools and dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends age sqlite3 2>&1 | tail -30
          pip install --require-hashes -r requirements.lock 2>&1 | tail -30
          pip install -r requirements-dev.txt 2>&1 | tail -30
          pip install playwright==1.63.0 2>&1 | tail -30
          python -m playwright install --with-deps chromium webkit 2>&1 | tail -30
      - name: Check menus, dashboard, and geometry
        env:
          UBYHOST_UBYPORT_ENV: mock
          UBYHOST_DEPLOYMENT: staging
          UBYHOST_ENABLE_SCHEDULER: '0'
          UBYHOST_REQUIRE_BROWSER: '1'
          UBYHOST_SHELL_BROWSERS: chromium,webkit
          UBYHOST_SHOTS_DIR: ${{ runner.temp }}/mobile-more-shots
        run: >-
          python -m pytest tests/test_design_shell_browser.py tests/test_design_shell.py
          tests/test_skeleton_loaders.py tests/test_needs_you_dashboard_0241.py
          tests/test_host_quiet_dashboard_browser.py tests/test_host_geometry.py
          tests/test_design_guardrails_browser.py
          -q --tb=short --junitxml=/tmp/mobile-more.xml 2>&1 | tail -30
      - name: Require passing checks without skips
        if: always()
        run: |
          python - <<'PY' 2>&1 | tail -30
          import xml.etree.ElementTree as ET
          cases = list(ET.parse("/tmp/mobile-more.xml").iter("testcase"))
          failed = sum(c.find("failure") is not None or c.find("error") is not None for c in cases)
          skipped = sum(c.find("skipped") is not None for c in cases)
          print(f"{len(cases) - failed - skipped} passed, {failed} failed, {skipped} skipped")
          if not cases or failed or skipped:
              raise SystemExit("Mobile More checks must pass with zero skips")
          PY
      - name: Upload 390 px menu screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-more-review
          path: |
            ${{ runner.temp }}/mobile-more-shots
            /tmp/mobile-more.xml
          if-no-files-found: error
