# Optional PostgreSQL 18 cutover overlay. Activate explicitly with
# -f docker-compose.yml -f docker-compose.postgres.yml; SQLite remains the
# default when this file is not selected.
services:
  ubyhost:
    shm_size: ${UBYHOST_PG_CUTOVER_SHM_SIZE:-1g}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web
      - database

  worker:
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - web
      - database

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: ubyhost-postgres:18.6-pgbackrest-2.60.0
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      POSTGRES_DB: ${UBYHOST_PG_DATABASE:?set UBYHOST_PG_DATABASE}
      POSTGRES_USER: ${UBYHOST_PG_SUPERUSER:?set UBYHOST_PG_SUPERUSER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --encoding=UTF8
      PGBACKREST_REPO1_S3_BUCKET: ${UBYHOST_PG_BACKREST_BUCKET:?set UBYHOST_PG_BACKREST_BUCKET}
      PGBACKREST_REPO1_S3_ENDPOINT: ${UBYHOST_PG_BACKREST_ENDPOINT:?set UBYHOST_PG_BACKREST_ENDPOINT}
      PGBACKREST_REPO1_S3_REGION: ${UBYHOST_PG_BACKREST_REGION:?set UBYHOST_PG_BACKREST_REGION}
    secrets:
      - postgres_superuser_password
      - pgbackrest_s3_key
      - pgbackrest_s3_secret
      - pgbackrest_cipher_pass
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=ubyhost archive-push "%p"
      - -c
      - archive_timeout=10s
      - -c
      - timezone=UTC
      - -c
      - max_wal_senders=4
      - -c
      - password_encryption=scram-sha-256
    volumes:
      - ubyhost-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - database
      - postgres-egress

  postgres-restore:
    profiles: ["postgres-restore"]
    image: ubyhost-postgres:18.6-pgbackrest-2.60.0
    build:
      context: ./postgres
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/pgbackrest-runner"]
    environment:
      PGBACKREST_REPO1_S3_BUCKET: ${UBYHOST_PG_BACKREST_BUCKET:?set UBYHOST_PG_BACKREST_BUCKET}
      PGBACKREST_REPO1_S3_ENDPOINT: ${UBYHOST_PG_BACKREST_ENDPOINT:?set UBYHOST_PG_BACKREST_ENDPOINT}
      PGBACKREST_REPO1_S3_REGION: ${UBYHOST_PG_BACKREST_REGION:?set UBYHOST_PG_BACKREST_REGION}
      PGBACKREST_PG1_PATH: /restore/18/docker
    secrets:
      - pgbackrest_s3_key
      - pgbackrest_s3_secret
      - pgbackrest_cipher_pass
    volumes:
      - postgres-restore-target:/restore
    networks:
      - postgres-restore-egress

  postgres-rehearsal:
    profiles: ["postgres-restore"]
    image: ubyhost-postgres:18.6-pgbackrest-2.60.0
    build:
      context: ./postgres
      dockerfile: Dockerfile
    restart: "no"
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      PGBACKREST_REPO1_S3_BUCKET: ${UBYHOST_PG_BACKREST_BUCKET:?set UBYHOST_PG_BACKREST_BUCKET}
      PGBACKREST_REPO1_S3_ENDPOINT: ${UBYHOST_PG_BACKREST_ENDPOINT:?set UBYHOST_PG_BACKREST_ENDPOINT}
      PGBACKREST_REPO1_S3_REGION: ${UBYHOST_PG_BACKREST_REGION:?set UBYHOST_PG_BACKREST_REGION}
    volumes:
      - postgres-restore-target:/var/lib/postgresql
    command: ["postgres", "-c", "default_transaction_read_only=on", "-c", "archive_mode=off", "-c", "listen_addresses=127.0.0.1"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h /var/run/postgresql"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    secrets:
      - pgbackrest_s3_key
      - pgbackrest_s3_secret
      - pgbackrest_cipher_pass
    networks:
      - postgres-restore-isolated
      - postgres-restore-egress

volumes:
  ubyhost-postgres-data:
    name: ubyhost-postgres-data
  postgres-restore-target:
    name: ${UBYHOST_PG_RESTORE_VOLUME:-ubyhost-postgres-restore-unused}

networks:
  database:
    name: ubyhost-database
    internal: true
  postgres-egress:
    name: ubyhost-postgres-egress
  postgres-restore-isolated:
    name: ubyhost-postgres-restore-isolated
    internal: true
  postgres-restore-egress:
    name: ubyhost-postgres-restore-egress

secrets:
  postgres_superuser_password:
    file: ${UBYHOST_PG_SUPERUSER_PASSWORD_FILE:?set UBYHOST_PG_SUPERUSER_PASSWORD_FILE}
  pgbackrest_s3_key:
    file: ${UBYHOST_PG_BACKREST_S3_KEY_FILE:?set UBYHOST_PG_BACKREST_S3_KEY_FILE}
  pgbackrest_s3_secret:
    file: ${UBYHOST_PG_BACKREST_S3_SECRET_FILE:?set UBYHOST_PG_BACKREST_S3_SECRET_FILE}
  pgbackrest_cipher_pass:
    file: ${UBYHOST_PG_BACKREST_CIPHER_PASS_FILE:?set UBYHOST_PG_BACKREST_CIPHER_PASS_FILE}
