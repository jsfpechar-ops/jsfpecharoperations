# UbyHost on AWS Lightsail — production stack.
# Run from this directory after copying .env.example → .env.
#
#   ./scripts/deploy.sh
#
# Requires: Docker Engine 24+ and Compose v2.
name: ubyhost

services:
  # 0463: PostgreSQL 16 for the cutover. No password: the server never listens on
  # a network (network_mode none, listen_addresses empty), so only containers that
  # mount the ubyhost-pgsock volume can reach it, the same trust boundary as the
  # SQLite file. pg-cutover.sh runs the rehearsal and the cutover against it.
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    restart: unless-stopped
    environment:
      POSTGRES_USER: ubyhost
      POSTGRES_DB: ubyhost
      POSTGRES_HOST_AUTH_METHOD: trust
    network_mode: none
    command:
      - postgres
      - -c
      - listen_addresses=
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=50
      - -c
      - log_min_duration_statement=1000
      # 1022: WAL archiving, on only when .env sets UBYHOST_PG_ARCHIVE=on
      # (production). No network here: archive_command only copies each WAL file
      # durably into the spool (tmp, sync, rename, sync dir; identical re-copy is
      # ok, a different file fails); the walg service ships it to S3.
      # archive_timeout=300: a segment at least every 5 minutes when there is
      # activity (about USD 0.05 a month in PUT requests).
      - -c
      - archive_mode=${UBYHOST_PG_ARCHIVE:-off}
      - -c
      - archive_timeout=300
      - -c
      - 'archive_command=if [ -f /walspool/%f ]; then cmp -s %p /walspool/%f; else cp %p /walspool/%f.tmp && sync /walspool/%f.tmp && mv /walspool/%f.tmp /walspool/%f && sync /walspool; fi'
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ubyhost", "-d", "ubyhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ubyhost-pgdata:/var/lib/postgresql/data
      - ubyhost-pgsock:/var/run/postgresql
      - ubyhost-walspool:/walspool
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # 1022: WAL-G sidecar, started only with COMPOSE_PROFILES containing walg
  # (production). Ships the WAL spool to S3 and runs the daily base backup
  # (1023). Default project network (not web), no port. Reaches Postgres only
  # through the socket volume (trust auth, like the app) and a read-only data
  # mount, as uid 70 = postgres in the Alpine image. Keys come from .env.walg
  # (root-only on the server, never in git); without it the shipper only logs
  # errors and the WAL waits in the spool.
  walg:
    profiles: ["walg"]
    build:
      context: ./walg
    image: ubyhost-walg:local
    restart: unless-stopped
    init: true
    user: "70:70"
    env_file:
      - path: .env.walg
        required: false
    command: ["/usr/local/bin/walg-ship.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ubyhost-pgdata:/var/lib/postgresql/data:ro
      - ubyhost-pgsock:/var/run/postgresql
      - ubyhost-walspool:/walspool
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  ubyhost:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ubyhost:local
    restart: unless-stopped
    stop_grace_period: 90s
    env_file: .env
    environment:
      UBYHOST_DATA_DIR: /data
      PORT: "8080"
      # WP06: uvicorn workers that only serve HTTP; jobs run in `worker`.
      # WP32: the number comes from UBYHOST_WEB_WORKERS in .env (image default
      # 2; 4 on the 8 GB / 2 vCPU server, see docs/LIGHTSAIL.md).
      UBYHOST_ROLE: web
    volumes:
      - ubyhost-data:/data
      - ubyhost-pgsock:/var/run/postgresql
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    # WP32: sized for the 8 GB / 2 vCPU production server. Web 2g + worker 1g
    # + caddy 256m leaves over 4 GB for the OS, Docker and
    # the page cache that serves SQLite reads. Each limit is a cap, not a
    # reservation; a smaller server (staging) sets lower values in .env.
    mem_limit: ${UBYHOST_WEB_MEM:-2g}
    # OPS-3: bound container logs so they cannot grow without limit. Rotated
    # lines are gone for good; capture anything needed during an incident.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - web

  # WP06: the background scheduler (iCal sync, UbyPort sweep, deadline watch,
  # mail outbox, photo sweep, retention) in its own process. Same image, env
  # and volume as the web app; it holds DATA_DIR/scheduler.lock, so a second
  # scheduler anywhere on this volume refuses to start.
  worker:
    image: ubyhost:local
    pull_policy: never
    restart: unless-stopped
    # A UbyPort batch already on the wire must record its answer.
    stop_grace_period: 90s
    env_file: .env
    environment:
      UBYHOST_DATA_DIR: /data
      UBYHOST_ROLE: worker
    command: ["python", "-m", "app.worker"]
    volumes:
      - ubyhost-data:/data
      - ubyhost-pgsock:/var/run/postgresql
    # No HTTP server: the worker touches /data/worker.alive every 30 s while
    # its scheduler runs.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/data/worker.alive') < 120 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: ${UBYHOST_WORKER_MEM:-1g}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Built and migrated by the web service first; also creates the volume
    # with the app's ownership on a fresh server.
    depends_on:
      ubyhost:
        condition: service_healthy
    networks:
      - web

  # Go port of the web app (plan v4 G1b). Runs the background jobs whose kinds
  # are listed in UBYHOST_GO_JOB_KINDS. HTTP only for paths in UBYHOST_GO_PATHS.
  # Off unless COMPOSE_PROFILES contains "go" (needs PostgreSQL).
  ubyhost-go:
    build:
      context: ../..
      dockerfile: go/Dockerfile
    image: ubyhost-go:local
    restart: unless-stopped
    stop_grace_period: 15s
    profiles: ["go"]
    env_file: .env
    environment:
      UBYHOST_DATABASE_URL: ${UBYHOST_DATABASE_URL:-}
      UBYHOST_GO_JOB_KINDS: ${UBYHOST_GO_JOB_KINDS:-}
      UBYHOST_STRIPE_MODE: ${UBYHOST_STRIPE_MODE:-off}
      UBYHOST_STRIPE_WEBHOOK_SECRET: ${UBYHOST_STRIPE_WEBHOOK_SECRET:-}
      UBYHOST_DATA_DIR: /data
    volumes:
      - ubyhost-pgsock:/var/run/postgresql
      - ubyhost-data:/data:ro
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: ${UBYHOST_GO_MEM:-128m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # goose runs in the web service first; the Go service starts after it.
    depends_on:
      ubyhost:
        condition: service_healthy
    networks:
      - web

  # Step 0: the mock UbyPort for the staging server only. Started only when
  # .env sets COMPOSE_PROFILES=staging; production never runs it. The image
  # leaves mock_ubyport out (.dockerignore), so the code is mounted from the
  # checkout. Staging .env points the app at it with
  # UBYHOST_MOCK_URL=http://mock-ubyport:8081/ws_uby/ws_uby.svc.
  mock-ubyport:
    profiles: ["staging"]
    image: ubyhost:local
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["python", "-m", "mock_ubyport.server"]
    environment:
      MOCK_UBYPORT_HOST: 0.0.0.0
      MOCK_UBYPORT_PORT: "8081"
      MOCK_UBYPORT_STATE: /tmp/mock_state.json
    volumes:
      - ../../App/mock_ubyport:/app/mock_ubyport:ro
    expose:
      - "8081"
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - web

  caddy:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      UBYHOST_DOMAIN: ${UBYHOST_DOMAIN}
      UBYHOST_APP_DOMAIN: ${UBYHOST_APP_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL}
      UBYHOST_GO_PATHS: ${UBYHOST_GO_PATHS:-/__go_off__}
    volumes:
      - ./caddy/Caddyfile.active:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: ${UBYHOST_CADDY_MEM:-256m}
    # OPS-3: bound Caddy's container logs too. Caddy access logging itself stays
    # off (see caddy/Caddyfile.cloudflare), so this only bounds lifecycle noise.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      ubyhost:
        condition: service_healthy
    networks:
      - web

  # OBS-1 (brief 0425): observability stack, started only with
  # COMPOSE_PROFILES=monitoring.
  # Ships container logs to Grafana Cloud Loki and host/container metrics to
  # Prometheus — see docs/OBSERVABILITY.md.
  alloy:
    profiles: ["monitoring"]
    # Pinned by digest (repo convention, like caddy).
    image: grafana/alloy:v1.10.1@sha256:582f5a5169cd67a2bdbf98777c1a6f596203f573cdef5c021749fd3279605768
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--server.http.listen-addr=0.0.0.0:12345"]
    # Only the variables this service needs are passed in, not the whole .env.
    environment:
      GRAFANA_PROM_URL: ${GRAFANA_PROM_URL:-}
      GRAFANA_PROM_USER: ${GRAFANA_PROM_USER:-}
      GRAFANA_PROM_TOKEN: ${GRAFANA_PROM_TOKEN:-}
      GRAFANA_LOKI_URL: ${GRAFANA_LOKI_URL:-}
      GRAFANA_LOKI_USER: ${GRAFANA_LOKI_USER:-}
      GRAFANA_LOKI_TOKEN: ${GRAFANA_LOKI_TOKEN:-}
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: ${UBYHOST_ALLOY_MEM:-512m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - web

  node-exporter:
    profiles: ["monitoring"]
    # Pinned by digest.
    image: prom/node-exporter:v1.9.1@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - web

  cadvisor:
    profiles: ["monitoring"]
    # Pinned by digest.
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - web

volumes:
  ubyhost-data:
    name: ubyhost-data
  ubyhost-pgdata:
    name: ubyhost-pgdata
  ubyhost-pgsock:
    name: ubyhost-pgsock
  ubyhost-walspool:
    name: ubyhost-walspool
  caddy-data:
    name: ubyhost-caddy-data
  caddy-config:
    name: ubyhost-caddy-config

networks:
  web:
    name: ubyhost-web
