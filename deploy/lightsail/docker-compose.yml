# UbyHost on AWS Lightsail — production stack.
# Run from this directory after copying .env.example → .env.
#
#   ./scripts/deploy.sh
#
# Requires: Docker Engine 24+ and Compose v2.
name: ubyhost

services:
  ubyhost:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ubyhost:local
    restart: unless-stopped
    stop_grace_period: 90s
    env_file: .env
    environment:
      UBYHOST_DATA_DIR: /data
      PORT: "8080"
    volumes:
      - ubyhost-data:/data
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    mem_limit: 768m
    # OPS-3: bound container logs so they cannot grow without limit. Rotated
    # lines are gone for good; capture anything needed during an incident.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - web

  caddy:
    image: caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      UBYHOST_DOMAIN: ${UBYHOST_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile.active:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    # OPS-3: bound Caddy's container logs too. Caddy access logging itself stays
    # off (see caddy/Caddyfile.cloudflare), so this only bounds lifecycle noise.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      ubyhost:
        condition: service_healthy
    networks:
      - web

volumes:
  ubyhost-data:
    name: ubyhost-data
  caddy-data:
    name: ubyhost-caddy-data
  caddy-config:
    name: ubyhost-caddy-config

networks:
  web:
    name: ubyhost-web
