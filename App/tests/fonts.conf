<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Match CI/desktop metrics: bundled Chromium substitutes Noto for UI fonts and
       Czech stay rows exceed the geometry cap. Prefer Liberation Sans instead. -->
  <alias>
    <family>Segoe UI</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias>
    <family>Roboto</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
</fontconfig>
