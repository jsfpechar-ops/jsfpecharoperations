<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <!-- Chromium maps the UI stack onto Noto Sans here. Noto is wider than the
       Segoe/Roboto metrics the stay-row geometry tests assume, so Czech rows
       wrap past the cap. Liberation Sans has those metrics. -->
  <match target="pattern">
    <test qual="any" name="family"><string>Noto Sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
</fontconfig>
