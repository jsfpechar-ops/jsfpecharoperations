<form method="get" action="{{ form_action }}" class="filters panel stay-fee-period-filter" data-auto-submit>
  <div class="field">
    <label for="stay-fee-period-month">{{ t('stay_fees.filter.period') }}</label>
    <input type="month" id="stay-fee-period-month" name="month"
           value="{{ month_key }}" max="{{ max_month_key }}"
           aria-describedby="stay-fee-period-hint">
    <p id="stay-fee-period-hint" class="small muted">{{ t('stay_fees.filter.hint') }}</p>
  </div>
  <div class="field filter-actions filter-actions-end">
    <a class="btn ghost" href="{{ form_action }}?month={{ prev_month_key }}"
       aria-label="{{ t('stay_fees.filter.prev') }}">{{ t('stay_fees.filter.prev') }}</a>
    {% if next_month_key %}
    <a class="btn ghost" href="{{ form_action }}?month={{ next_month_key }}"
       aria-label="{{ t('stay_fees.filter.next') }}">{{ t('stay_fees.filter.next') }}</a>
    {% else %}
    <button class="btn ghost" type="button" disabled>{{ t('stay_fees.filter.next') }}</button>
    {% endif %}
    <button class="btn filter-apply" type="submit">{{ t('common.apply') }}</button>
  </div>
</form>
