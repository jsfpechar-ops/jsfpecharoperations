{#- 0789b: pill tabs; `pills` is a list of {label, href, current}.
    Set wrap_on_phone=true for filters that should all stay visible on phones. -#}
<nav class="settings-pills" aria-label="{{ aria_label }}"{% if wrap_on_phone | default(false) %} data-wrap-on-phone{% endif %}>
  {% for pill in pills %}<a class="settings-pill{% if pill.current %} is-current{% endif %}" href="{{ pill.href }}"{% if pill.current %} aria-current="page"{% endif %}>{{ pill.label }}</a>{% endfor %}
</nav>
