{% extends "guest/base.html" %}
{% block content %}
<div class="g-card">
  <h2>{{ t('pin_title') }}</h2>
  <p class="g-intro">{{ t('pin_help') }}</p>
  {% if error %}<div class="g-err">{{ error }}</div>{% endif %}
  <form method="post" action="/l/{{ token }}/pin?lang={{ lang }}">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <input type="hidden" name="return_to" value="{{ return_to }}">
    <div class="g-field">
      <label for="pin">{{ t('pin_label') }}</label>
      <input type="text" id="pin" name="pin" inputmode="numeric" pattern="[0-9]{4}|[0-9]{6}"
             maxlength="6" autocomplete="one-time-code" required autofocus class="g-pin-input">
    </div>
    {% if require_turnstile and turnstile_site_key %}
      <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}" data-action="guest_pin"></div>
    {% endif %}
    <button class="g-btn" type="submit">{{ t('pin_submit') }}</button>
    <p class="g-pin-recovery">{{ t('pin_recovery') }}</p>
  </form>
</div>
{% if require_turnstile and turnstile_site_key %}
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{% endif %}
{% endblock %}
