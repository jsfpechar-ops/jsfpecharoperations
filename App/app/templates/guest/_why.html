<details class="{{ why_classes | default('g-card g-why') }}">
  <summary class="g-why-summary">{{ t('why_title') }}</summary>
  <p class="g-intro">{{ t('legal_intro') }}</p>
  <div class="g-details">
    <p>{{ t('why_point_accuracy') }}</p>
    <p class="g-law">{{ t('why_law') }}</p>
    {% if privacy_url %}
      <p style="margin-bottom:0"><a href="{{ privacy_url }}">{{ t('privacy_link') }} &rarr;</a></p>
    {% endif %}
  </div>
</details>
