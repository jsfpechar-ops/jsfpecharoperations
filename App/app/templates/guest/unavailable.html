{% extends "guest/base.html" %}
{% block content %}
<div class="g-card">
  <div class="g-big-ok">
    <div class="mark neutral">?</div>
    <h2>{{ t(title_key) }}</h2>
    <p class="g-intro">{{ t(body_key) }}</p>
    {% if host_note %}<p class="g-host-note" role="note" data-host-note>{{ host_note }}</p>{% endif %}
    {% if offer_message_host and host_message_url %}
      <a class="g-btn" href="{{ host_message_url }}" data-message-host>{{ t('message_host') }}</a>
    {% endif %}
    {% if restart_url %}
      <a class="g-btn ghost" href="{{ restart_url }}">{{ t('start_over') }}</a>
    {% endif %}
  </div>
</div>
{% endblock %}
