{% extends "setup/_layout.html" %}
{% block wizard_body %}
<header class="wizard-head">
  <h1>{{ t('setup.name.title') }}</h1>
</header>
<form class="wizard-form" method="post" action="/setup/name">
  <input type="hidden" name="active" value="1">
  <label class="wizard-field" for="internal_name">
    <span>{{ t('setup.name.label') }}</span>
    <input id="internal_name" name="internal_name" type="text" maxlength="80"
           placeholder="{{ t('setup.name.placeholder') }}"
           value="{{ apartment.internal_name if apartment else '' }}" required>
  </label>
  {% if name_error %}<p class="wizard-error" role="alert">{{ t('setup.name.error') }}</p>{% endif %}
  <div class="wizard-actions">
    <a class="btn ghost wizard-back" href="/setup/welcome">{{ t('setup.frame.back') }}</a>
    <button class="btn primary wizard-continue" type="submit">{{ t('setup.frame.continue') }}</button>
  </div>
</form>
{% endblock %}
