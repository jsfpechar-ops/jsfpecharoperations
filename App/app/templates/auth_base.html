<!doctype html>
<html lang="{{ lang | default('en') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf6f2">
  <title>{% block title %}UbyHost{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/app.css?v=20260912e">
</head>
<body class="auth-page">
  <div class="auth-layout">
    <section class="auth-panel">
      <header class="auth-brand">
        <img class="auth-logo" src="/static/ubyhost-logo.png" alt="UbyHost">
      </header>
      <form method="post" action="/language" class="lang-switch auth-lang-switch">
        <input type="hidden" name="next" value="{{ request.url.path }}{% if request.url.query %}?{{ request.url.query }}{% endif %}">
        <button type="submit" name="lang" value="en" class="{{ 'is-active' if lang == 'en' }}">{{ t('lang.en') }}</button>
        <button type="submit" name="lang" value="cs" class="{{ 'is-active' if lang == 'cs' }}">{{ t('lang.cs') }}</button>
      </form>
      {% block auth_body %}{% endblock %}
    </section>
    <aside class="auth-hero" aria-hidden="true">
      <div class="auth-hero-inner">
        <img class="auth-hero-mark" src="/static/ubyhost-mark.png" alt="">
        <h2>{{ t('login.hero_title') }}</h2>
        <p>{{ t('login.hero_body') }}</p>
      </div>
    </aside>
  </div>
</body>
</html>
