{% extends "base.html" %}
{% set show_nav = false %}
{% set wrap_class = 'narrow' %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>UbyHost</h1>
<p class="lede">Log in to manage your guest reporting.</p>
{% if error %}<div class="banner err"><div class="grow">{{ error }}</div></div>{% endif %}
<form method="post" action="/login" class="panel">
  <input type="hidden" name="next" value="{{ request.query_params.get('next', '') }}">
  <div class="field">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" required autofocus
           autocomplete="username" autocapitalize="none" spellcheck="false">
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">
  </div>
  <div class="actions"><button class="btn primary" type="submit">Log in</button></div>
</form>
{% endblock %}
